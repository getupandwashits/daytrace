name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Package and verify signature
        run: ./scripts/build.sh
      - name: Race tests
        run: go test -race ./...
